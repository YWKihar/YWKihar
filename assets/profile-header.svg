<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Yousef Kihar, Junior DevOps Engineer. Linux, Cloud, Automation, CI/CD" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>

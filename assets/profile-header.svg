    <text x="70" y="216" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#E4002B">Junior DevOps Engineer</text>
    <text x="70" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#9CA3AF">Linux  •  Cloud  •  Automation  •  CI/CD</text>

      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#161B22"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="320" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#card)">

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset=".52" stop-color="#101e30"/><stop offset="1" stop-color="#07140f"/></linearGradient>
 <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#49b5ff"/><stop offset=".52" stop-color="#a8e20e"/><stop offset="1" stop-color="#5de0ad"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#9bb0c5" stroke-opacity=".055"/></pattern>
 <style>
 .label{font:700 17px Arial,sans-serif;letter-spacing:1.1px;fill:#f4f8fc}
 .sub{font:13px Arial,sans-serif;fill:#9eb2c8}
 .num{font:700 12px Arial,sans-serif;fill:#a8e20e;letter-spacing:1.5px}
 .node{fill:#101f31;stroke:#38516a;stroke-width:1.5}
 .route{fill:none;stroke:url(#line);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:10 12;animation:flow 8s linear infinite}
 .pulse{fill:#a8e20e;filter:url(#glow);animation:pulse 2.4s ease-in-out infinite}
 @keyframes flow{to{stroke-dashoffset:-220}}
 @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
 @media (prefers-reduced-motion:reduce){.route,.pulse{animation:none}}
 </style>
</defs>
<rect width="1200" height="590" rx="24" fill="url(#bg)"/><rect width="1200" height="590" rx="24" fill="url(#grid)"/>
<text x="58" y="56" fill="#a8e20e" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="4">ENGINEERING SYSTEM / 01</text>
<text x="58" y="96" fill="#f5f8fc" font-family="Arial,sans-serif" font-size="32" font-weight="700">THE DEVOPS LIFECYCLE</text>
<text x="60" y="124" fill="#9eb2c8" font-family="Arial,sans-serif" font-size="15">A continuous delivery loop — from planning to operational feedback</text>
<path class="route" d="M190 230H1010Q1050 230 1050 270V335Q1050 375 1010 375H190Q150 375 150 415V438"/>
<path d="M150 438H1050" stroke="#a8e20e" stroke-opacity=".13" stroke-width="1" stroke-dasharray="3 8"/>
<g>
<rect class="node" x="55" y="176" width="260" height="108" rx="15"/><text class="num" x="77" y="203">01 / DISCOVER</text><text class="label" x="77" y="235">PLAN</text><text class="sub" x="77" y="259">Scope · Priorities · Design</text>
<rect class="node" x="345" y="176" width="260" height="108" rx="15"/><text class="num" x="367" y="203">02 / AUTHOR</text><text class="label" x="367" y="235">CODE</text><text class="sub" x="367" y="259">Source control · Review</text>
<rect class="node" x="635" y="176" width="260" height="108" rx="15"/><text class="num" x="657" y="203">03 / INTEGRATE</text><text class="label" x="657" y="235">BUILD &amp; TEST</text><text class="sub" x="657" y="259">Package · Validate · Quality</text>
<rect class="node" x="925" y="176" width="220" height="108" rx="15"/><text class="num" x="947" y="203">04 / PREPARE</text><text class="label" x="947" y="235">RELEASE</text><text class="sub" x="947" y="259">Version · Approve</text>
<rect class="node" x="925" y="322" width="220" height="108" rx="15"/><text class="num" x="947" y="349">05 / DELIVER</text><text class="label" x="947" y="381">DEPLOY</text><text class="sub" x="947" y="405">Automate · Roll out</text>
<rect class="node" x="635" y="322" width="260" height="108" rx="15"/><text class="num" x="657" y="349">06 / RUN</text><text class="label" x="657" y="381">OPERATE</text><text class="sub" x="657" y="405">Availability · Reliability</text>
<rect class="node" x="345" y="322" width="260" height="108" rx="15"/><text class="num" x="367" y="349">07 / OBSERVE</text><text class="label" x="367" y="381">MONITOR</text><text class="sub" x="367" y="405">Metrics · Logs · Alerts</text>
<rect class="node" x="55" y="322" width="260" height="108" rx="15"/><text class="num" x="77" y="349">08 / IMPROVE</text><text class="label" x="77" y="381">FEEDBACK</text><text class="sub" x="77" y="405">Learn · Adapt · Iterate</text>
</g>
<g fill="none" stroke="#a8e20e" stroke-width="2" opacity=".9"><path d="M315 230h30m-9 -7 9 7-9 7"/><path d="M605 230h30m-9 -7 9 7-9 7"/><path d="M895 230h30m-9 -7 9 7-9 7"/><path d="M1035 284v38m-7 -9 7 9 7 -9"/><path d="M925 376h-30m9 -7-9 7 9 7"/><path d="M635 376h-30m9 -7-9 7 9 7"/><path d="M345 376h-30m9 -7-9 7 9 7"/></g>
<circle class="pulse" cx="150" cy="438" r="5"/>
<path d="M150 438V478Q150 498 170 498H1020Q1040 498 1040 478V438" fill="none" stroke="#a8e20e" stroke-width="2" stroke-dasharray="5 8" opacity=".65"/>
<text x="600" y="536" fill="#a8e20e" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" text-anchor="middle">CONTINUOUS FEEDBACK  ↻  CONTINUOUS IMPROVEMENT</text>
<text x="600" y="563" fill="#8298af" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">Plan → Code → Build → Test → Release → Deploy → Operate → Monitor</text>
</svg>